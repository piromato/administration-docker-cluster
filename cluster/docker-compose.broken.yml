# A deliberately incomplete cluster: the primaries set a default primaries
# count but no secondaries count, so the two secondary servers join discovery
# but are never allocated the default database. They show up as `Free`.
# The "Allocate the secondaries" lesson uses this file to reproduce and fix
# that situation. The complete, correct configuration is in docker-compose.yml.

networks:
    skyshard:
        driver: bridge

services:

    # ── PRIMARY nodes (read + write, participate in Raft elections) ───────────

    core-1:
        image: neo4j:5.26-enterprise
        hostname: core-1
        container_name: core-1
        ports:
            - "7474:7474"
            - "7687:7687"
        environment:
            NEO4J_AUTH: neo4j/neo4j-password
            NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
            NEO4J_server_default__listen__address: "0.0.0.0"
            NEO4J_server_default__advertised__address: "core-1"
            NEO4J_server_bolt_advertised__address: "core-1:7687"
            NEO4J_server_discovery_advertised__address: "core-1:5000"
            NEO4J_server_cluster_advertised__address: "core-1:6000"
            NEO4J_server_cluster_raft_advertised__address: "core-1:7000"
            NEO4J_dbms_cluster_discovery_endpoints: "core-1:5000,core-2:5000,core-3:5000"
            NEO4J_dbms_cluster_minimum__initial__system__primaries__count: "3"
            NEO4J_initial_server_mode__constraint: "PRIMARY"
            NEO4J_initial_dbms_default__primaries__count: "3"
        volumes:
            - "core-1-data:/data"
        networks:
            - skyshard

    core-2:
        image: neo4j:5.26-enterprise
        hostname: core-2
        container_name: core-2
        ports:
            - "17474:7474"
            - "17687:7687"
        environment:
            NEO4J_AUTH: neo4j/neo4j-password
            NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
            NEO4J_server_default__listen__address: "0.0.0.0"
            NEO4J_server_default__advertised__address: "core-2"
            NEO4J_server_bolt_advertised__address: "core-2:7687"
            NEO4J_server_discovery_advertised__address: "core-2:5000"
            NEO4J_server_cluster_advertised__address: "core-2:6000"
            NEO4J_server_cluster_raft_advertised__address: "core-2:7000"
            NEO4J_dbms_cluster_discovery_endpoints: "core-1:5000,core-2:5000,core-3:5000"
            NEO4J_dbms_cluster_minimum__initial__system__primaries__count: "3"
            NEO4J_initial_server_mode__constraint: "PRIMARY"
            NEO4J_initial_dbms_default__primaries__count: "3"
        volumes:
            - "core-2-data:/data"
        networks:
            - skyshard

    core-3:
        image: neo4j:5.26-enterprise
        hostname: core-3
        container_name: core-3
        ports:
            - "27474:7474"
            - "27687:7687"
        environment:
            NEO4J_AUTH: neo4j/neo4j-password
            NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
            NEO4J_server_default__listen__address: "0.0.0.0"
            NEO4J_server_default__advertised__address: "core-3"
            NEO4J_server_bolt_advertised__address: "core-3:7687"
            NEO4J_server_discovery_advertised__address: "core-3:5000"
            NEO4J_server_cluster_advertised__address: "core-3:6000"
            NEO4J_server_cluster_raft_advertised__address: "core-3:7000"
            NEO4J_dbms_cluster_discovery_endpoints: "core-1:5000,core-2:5000,core-3:5000"
            NEO4J_dbms_cluster_minimum__initial__system__primaries__count: "3"
            NEO4J_initial_server_mode__constraint: "PRIMARY"
            NEO4J_initial_dbms_default__primaries__count: "3"
        volumes:
            - "core-3-data:/data"
        networks:
            - skyshard

    # ── SECONDARY nodes (read-only replicas, no Raft vote) ───────────────────

    secondary-1:
        image: neo4j:5.26-enterprise
        hostname: secondary-1
        container_name: secondary-1
        ports:
            - "37474:7474"
            - "37687:7687"
        environment:
            NEO4J_AUTH: neo4j/neo4j-password
            NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
            NEO4J_server_default__listen__address: "0.0.0.0"
            NEO4J_server_default__advertised__address: "secondary-1"
            NEO4J_server_bolt_advertised__address: "secondary-1:7687"
            NEO4J_server_discovery_advertised__address: "secondary-1:5000"
            NEO4J_server_cluster_advertised__address: "secondary-1:6000"
            NEO4J_server_cluster_raft_advertised__address: "secondary-1:7000"
            # Secondaries still need to find the cluster, but don't vote
            NEO4J_dbms_cluster_discovery_endpoints: "core-1:5000,core-2:5000,core-3:5000"
            NEO4J_initial_server_mode__constraint: "SECONDARY"
            NEO4J_server_cluster_system__database__mode: "SECONDARY"
        volumes:
            - "secondary-1-data:/data"
        networks:
            - skyshard
        depends_on:
            - core-1
            - core-2
            - core-3

    secondary-2:
        image: neo4j:5.26-enterprise
        hostname: secondary-2
        container_name: secondary-2
        ports:
            - "47474:7474"
            - "47687:7687"
        environment:
            NEO4J_AUTH: neo4j/neo4j-password
            NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
            NEO4J_server_default__listen__address: "0.0.0.0"
            NEO4J_server_default__advertised__address: "secondary-2"
            NEO4J_server_bolt_advertised__address: "secondary-2:7687"
            NEO4J_server_discovery_advertised__address: "secondary-2:5000"
            NEO4J_server_cluster_advertised__address: "secondary-2:6000"
            NEO4J_server_cluster_raft_advertised__address: "secondary-2:7000"
            NEO4J_dbms_cluster_discovery_endpoints: "core-1:5000,core-2:5000,core-3:5000"
            NEO4J_initial_server_mode__constraint: "SECONDARY"
            NEO4J_server_cluster_system__database__mode: "SECONDARY"
        volumes:
            - "secondary-2-data:/data"
        networks:
            - skyshard
        depends_on:
            - core-1
            - core-2
            - core-3

volumes:
    core-1-data:
    core-2-data:
    core-3-data:
    secondary-1-data:
    secondary-2-data:
